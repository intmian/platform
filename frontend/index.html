<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <meta name="theme-color" content="#f2ede6"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="Platform"/>
    <link href="/favicon-32.png" rel="icon" type="image/png"/>
    <link href="/icons/plat-180.png" rel="apple-touch-icon"/>
    <link rel="manifest" href="/manifest.json">
    <!-- 桌面默认壁纸的插画，和 JS 并行下载，桌面入场不用等它 -->
    <link rel="preload" as="image" href="/desk/girl.png"/>
    <title>Platform</title>
    <style>
        /* JS 加载完之前先显示和桌面同色的底，避免白屏一闪 */
        #boot { position: fixed; inset: 0; background: #f2ede6; display: flex; align-items: center; justify-content: center; }
        #boot img { width: 56px; height: 56px; border-radius: 14px; opacity: .9; animation: boot-in .4s ease both .15s; }
        @keyframes boot-in { from { opacity: 0; transform: scale(.94); } }
        #root:not(:empty) + #boot { display: none; }
    </style>
</head>
<body>
<div id="root"></div>
<div id="boot"><img src="/icons/plat-192.png" alt=""/></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
