# 名字沿用第一次测试时部署的 Worker，地址不变。
name = "platform-openai-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"
# 已下线：香港服务器经 Worker 访问 OpenAI 仍被判定为香港，公网入口关闭，代码保留。
workers_dev = false
preview_urls = false

# 上游请求由固定在美国西部的 Durable Object 发出，见 worker.js。
[[durable_objects.bindings]]
name = "UPSTREAM_RELAY"
class_name = "UpstreamRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UpstreamRelay"]
